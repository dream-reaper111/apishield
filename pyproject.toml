[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "apishield"
version = "0.1.0"
requires-python = ">=3.12"
dependencies = []

[project.optional-dependencies]
yaml = ["PyYAML>=6,<7"]
dev = ["pytest>=8,<10", "ruff>=0.8,<1", "PyYAML>=6,<7"]

[project.scripts]
apishield = "apishield.cli:main"

[tool.setuptools.packages.find]
include = ["apishield*"]

[tool.ruff]
target-version = "py312"
line-length = 100
[tool.ruff.lint]
select = ["E", "F", "B"]
ignore = ["E501"]
